name: 发布并核验看板

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: steelwatch-pages-deploy
  queue: max

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      status_digest: ${{ steps.digest.outputs.status_digest }}
      latest_digest: ${{ steps.digest.outputs.latest_digest }}
      items_digest: ${{ steps.digest.outputs.items_digest }}
      feed_digest: ${{ steps.digest.outputs.feed_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: 记录本次发布数据校验值
        id: digest
        run: |
          echo "status_digest=$(sha256sum docs/data/status.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "latest_digest=$(sha256sum docs/data/latest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "items_digest=$(sha256sum docs/data/items.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "feed_digest=$(sha256sum docs/feed.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}

  verify:
    name: 验证网页已发布本次数据
    needs: [package, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证Pages实际返回的数据与本次构建一致
        env:
          EXPECTED_STATUS: ${{ needs.package.outputs.status_digest }}
          EXPECTED_LATEST: ${{ needs.package.outputs.latest_digest }}
          EXPECTED_ITEMS: ${{ needs.package.outputs.items_digest }}
          EXPECTED_FEED: ${{ needs.package.outputs.feed_digest }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://davidzhu511.github.io/china-steel-policy-watch"
          check_file() {
            local path="$1" expected="$2" file
            file="$(mktemp)"
            if ! curl --fail --location --silent --show-error --connect-timeout 8 --max-time 18 \
              -H "Cache-Control: no-cache" \
              "${base}/${path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$file"; then
              rm -f "$file"
              return 1
            fi
            local actual
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            rm -f "$file"
            [[ "$actual" == "$expected" ]]
          }
          for attempt in 1 2 3 4 5 6; do
            if check_file "data/status.json" "$EXPECTED_STATUS" \
               && check_file "data/latest.json" "$EXPECTED_LATEST" \
               && check_file "data/items.json" "$EXPECTED_ITEMS" \
               && check_file "feed.xml" "$EXPECTED_FEED"; then
              echo "PUBLISHED: 本次网页数据、最新新闻与RSS均可从公网读取并与构建一致"
              exit 0
            fi
            echo "网页数据尚未同步至本次版本；重试 ${attempt}/6"
            sleep 10
          done
          echo "::error::DEPLOY_FAILED: GitHub Pages线上内容与本次构建不一致"
          exit 1
