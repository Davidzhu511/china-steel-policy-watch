name: 每日更新并部署看板

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - "config/**"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "scripts/**"
      - "steelwatch/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    # GitHub cron uses UTC. Running both slots plus a Berlin DST gate keeps 07:50 local time year-round.
    - cron: "50 5 * * *"
    - cron: "50 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: steelwatch-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      run: ${{ steps.gate.outputs.run }}
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 判断杜塞尔多夫当地时间
        id: gate
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: PYTHONPATH=. python scripts/schedule_gate.py >> "$GITHUB_OUTPUT"

      - name: 配置 Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装程序
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e ".[dev]"

      - name: 运行测试
        if: steps.gate.outputs.run == 'true'
        run: pytest

      - name: 缓存离线翻译模型
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/opus-en-zh
          key: steelwatch-opus-en-zh-408d9bc4-v1

      - name: 安装离线翻译环境
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          python -m pip install 'torch==2.14.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[translation]'

      - name: 准备已校验的翻译模型
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/prepare_translation.py

      - name: 采集、翻译并生成看板数据
        if: steps.gate.outputs.run == 'true'
        env:
          STEELWATCH_MODEL_ENDPOINT: ${{ vars.STEELWATCH_MODEL_ENDPOINT }}
          STEELWATCH_MODEL: ${{ vars.STEELWATCH_MODEL }}
          STEELWATCH_MODEL_API_KEY: ${{ secrets.STEELWATCH_MODEL_API_KEY }}
          STEELWATCH_MT_DIR: .cache/opus-en-zh
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m steelwatch update

      - name: 保存本次数据
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "steelwatch-bot"
          git config user.email "steelwatch-bot@users.noreply.github.com"
          git add data docs/data docs/feed.xml docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No dashboard data changed"
          else
            git commit -m "data: daily steel intelligence update"
            git push
          fi

      - name: 配置 GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

  deploy:
    if: needs.update.outputs.run == 'true'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.update.outputs.artifact_name }}
