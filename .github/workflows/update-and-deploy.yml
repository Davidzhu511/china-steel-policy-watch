name: 更新钢铁情报数据

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - ".github/workflows/editorial-automerge.yml"
      - ".github/workflows/translate-and-publish.yml"
      - ".github/workflows/publish-pages.yml"
      - "config/**"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "scripts/**"
      - "steelwatch/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    # Collect at 07:50, 13:50 and 19:50 Berlin time.
    - cron: "50 5 * * *"
    - cron: "50 6 * * *"
    - cron: "50 11 * * *"
    - cron: "50 12 * * *"
    - cron: "50 17 * * *"
    - cron: "50 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Collect sources or publish existing editorial content
        type: choice
        options: [collect, editorial]
        default: collect

permissions:
  contents: write
  actions: write

concurrency:
  group: steelwatch-data-write
  queue: max

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 判断杜塞尔多夫当地时间
        id: gate
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: PYTHONPATH=. python scripts/schedule_gate.py >> "$GITHUB_OUTPUT"

      - name: 配置 Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装程序
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e ".[dev]"

      - name: 运行测试
        if: steps.gate.outputs.run == 'true'
        run: pytest

      - name: 采集原文并应用已核验的ChatGPT解读
        if: steps.gate.outputs.run == 'true'
        id: update-data
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          mode="$REQUESTED_MODE"
          # Pure editorial pushes publish the saved collection without re-fetching.
          if [[ "$EVENT_NAME" == "push" ]] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            if [[ -n "$changed" ]] && ! echo "$changed" | grep -qvE '^config/((editorial|triage)\.json|reviews/[^/]+\.json)$'; then
              mode=editorial
            fi
          fi
          echo "mode=${mode:-collect}" >> "$GITHUB_OUTPUT"
          if [[ "$mode" == "editorial" ]]; then
            python -m steelwatch publish-editorial
          else
            python -m steelwatch update
          fi

      - name: 保存本次数据
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "steelwatch-bot"
          git config user.email "steelwatch-bot@users.noreply.github.com"
          git add data docs/data docs/feed.xml docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No dashboard data changed"
          else
            git commit -m "data: daily steel intelligence update"
            git pull --rebase origin main
            git push
          fi

      - name: 数据就绪后分别启动初译和网页发布
        if: steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        env:
          UPDATE_MODE: ${{ steps.update-data.outputs.mode }}
        with:
          script: |
            const workflows = ['publish-pages.yml'];
            if (process.env.UPDATE_MODE === 'collect') {
              workflows.push('translate-and-publish.yml');
            }
            const results = await Promise.allSettled(workflows.map(workflow_id =>
              github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id, ref: 'main',
              })
            ));
            for (const [index, result] of results.entries()) {
              if (result.status === 'rejected') {
                core.setFailed(workflows[index] + ': ' + result.reason.message);
              }
            }
