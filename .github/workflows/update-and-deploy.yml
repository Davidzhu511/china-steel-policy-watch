name: 每日更新并部署看板

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - ".github/workflows/editorial-automerge.yml"
      - "config/**"
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
      - "scripts/**"
      - "steelwatch/**"
      - "tests/**"
      - "pyproject.toml"
  schedule:
    # Collect at 07:50 and 13:50 Berlin time, independently of ChatGPT reviews.
    - cron: "50 5 * * *"
    - cron: "50 6 * * *"
    - cron: "50 11 * * *"
    - cron: "50 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Collect sources or publish existing editorial content
        type: choice
        options: [collect, editorial]
        default: collect

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: steelwatch-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      run: ${{ steps.gate.outputs.run }}
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      status_digest: ${{ steps.digest.outputs.status_digest }}
      latest_digest: ${{ steps.digest.outputs.latest_digest }}
      items_digest: ${{ steps.digest.outputs.items_digest }}
      feed_digest: ${{ steps.digest.outputs.feed_digest }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 判断杜塞尔多夫当地时间
        id: gate
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: PYTHONPATH=. python scripts/schedule_gate.py >> "$GITHUB_OUTPUT"

      - name: 配置 Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装程序
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install -e ".[dev]"

      - name: 运行测试
        if: steps.gate.outputs.run == 'true'
        run: pytest

      - name: 采集原文并应用已核验的ChatGPT解读
        if: steps.gate.outputs.run == 'true'
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mode="$REQUESTED_MODE"
          # Pure editorial pushes publish the saved collection without re-fetching.
          if [[ "$EVENT_NAME" == "push" ]] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE_SHA" HEAD)"
            if [[ -n "$changed" ]] && ! echo "$changed" | grep -qvE '^config/(editorial|triage)\.json$'; then
              mode=editorial
            fi
          fi
          if [[ "$mode" == "editorial" ]]; then
            python -m steelwatch publish-editorial
          else
            python -m steelwatch update
          fi

      - name: 保存本次数据
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "steelwatch-bot"
          git config user.email "steelwatch-bot@users.noreply.github.com"
          git add data docs/data docs/feed.xml docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "No dashboard data changed"
          else
            git commit -m "data: daily steel intelligence update"
            git push
          fi

      - name: 记录本次发布数据校验值
        id: digest
        if: steps.gate.outputs.run == 'true'
        run: |
          echo "status_digest=$(sha256sum docs/data/status.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "latest_digest=$(sha256sum docs/data/latest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "items_digest=$(sha256sum docs/data/items.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "feed_digest=$(sha256sum docs/feed.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 配置 GitHub Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包 Pages
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs

  deploy:
    if: needs.update.outputs.run == 'true'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.update.outputs.artifact_name }}

  verify:
    name: 验证网页已发布本次数据
    needs: [update, deploy]
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 验证Pages实际返回的数据与本次构建一致
        env:
          EXPECTED_STATUS: ${{ needs.update.outputs.status_digest }}
          EXPECTED_LATEST: ${{ needs.update.outputs.latest_digest }}
          EXPECTED_ITEMS: ${{ needs.update.outputs.items_digest }}
          EXPECTED_FEED: ${{ needs.update.outputs.feed_digest }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://davidzhu511.github.io/china-steel-policy-watch"
          check_file() {
            local path="$1" expected="$2" file
            file="$(mktemp)"
            if ! curl --fail --location --silent --show-error --connect-timeout 8 --max-time 18 \
              -H "Cache-Control: no-cache" \
              "${base}/${path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$file"; then
              rm -f "$file"
              return 1
            fi
            local actual
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            rm -f "$file"
            [[ "$actual" == "$expected" ]]
          }
          for attempt in 1 2 3 4 5 6; do
            if check_file "data/status.json" "$EXPECTED_STATUS" \
               && check_file "data/latest.json" "$EXPECTED_LATEST" \
               && check_file "data/items.json" "$EXPECTED_ITEMS" \
               && check_file "feed.xml" "$EXPECTED_FEED"; then
              echo "PUBLISHED: 本次网页数据、最新新闻与RSS均可从公网读取并与构建一致"
              exit 0
            fi
            echo "网页数据尚未同步至本次版本；重试 ${attempt}/6"
            sleep 10
          done
          echo "::error::DEPLOY_FAILED: GitHub Pages线上内容与本次构建不一致"
          exit 1
